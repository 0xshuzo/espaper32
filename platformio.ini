[env]
platform = espressif32
framework = arduino
monitor_speed = 115200

; Local sibling library: no copied driver source.
lib_deps =
    Epd7in5V2=symlink://../epd7in5_v2_driver
build_src_filter = +<main.cpp> +<monochrome_canvas.cpp>

[env:esp32-hardware]
board = esp32dev
build_flags =
    -D EPD_SCK_PIN=18
    -D EPD_MOSI_PIN=23
    -D EPD_CS_PIN=5
    -D EPD_DC_PIN=17
    -D EPD_RST_PIN=16
    -D EPD_BUSY_PIN=4
